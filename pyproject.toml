[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nass"
version = "0.4.0"
description = "Arabic text, handled correctly, everywhere Python touches it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codox" }]
keywords = ["arabic", "rtl", "i18n", "l10n", "localization", "text", "unicode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Arabic",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "mypy>=1.11", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/pyXploit/nass"
Issues = "https://github.com/pyXploit/nass/issues"
Changelog = "https://github.com/pyXploit/nass/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nass"]

[tool.hatch.build.targets.wheel.force-include]
"src/nass/data/nouns.jsonl.gz" = "nass/data/nouns.jsonl.gz"
"src/nass/data/arramooz.jsonl.gz" = "nass/data/arramooz.jsonl.gz"
"src/nass/data/LICENSE" = "nass/data/LICENSE"

[tool.pytest.ini_options]
testpaths = ["tests", "src/nass"]
addopts = "-q --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true
